<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Chart.js - Mermas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .chart-container {
            position: relative;
            height: 400px;
            margin: 20px 0;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .loading i {
            font-size: 2rem;
            color: #007bff;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center">
                    <i class="fas fa-chart-pie text-danger"></i>
                    Test de Chart.js - Mermas
                </h1>
                <p class="text-center text-muted">Verificación independiente de Chart.js</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Estado de Chart.js</h5>
                    </div>
                    <div class="card-body">
                        <div id="chartStatus" class="alert alert-info">
                            <i class="fas fa-spinner fa-spin"></i> Verificando Chart.js...
                        </div>
                        <button class="btn btn-primary" onclick="testChart()">
                            <i class="fas fa-play"></i> Probar Gráfica
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Gráfica de Prueba</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="testChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Mermas por Causa</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="causaChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Mermas por Galpón</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="galponChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script>
    let charts = {};

    function testChart() {
        const statusDiv = document.getElementById('chartStatus');
        
        try {
            // Verificar si Chart.js está disponible
            if (typeof Chart === 'undefined') {
                statusDiv.className = 'alert alert-danger';
                statusDiv.innerHTML = '<i class="fas fa-times-circle"></i> Error: Chart.js no está disponible';
                return;
            }
            
            statusDiv.className = 'alert alert-success';
            statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Chart.js está funcionando correctamente';
            
            // Crear gráfica simple de prueba
            const ctx = document.getElementById('testChart');
            if (ctx && !charts.test) {
                charts.test = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun'],
                        datasets: [{
                            label: 'Mermas (kg)',
                            data: [15.2, 18.8, 22.5, 19.0, 25.3, 24.7],
                            borderColor: '#dc3545',
                            backgroundColor: 'rgba(220, 53, 69, 0.1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Evolución de Mermas',
                                color: '#495057',
                                font: { size: 16 }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { color: '#495057' }
                            },
                            x: {
                                ticks: { color: '#495057' }
                            }
                        }
                    }
                });
                
                statusDiv.innerHTML += '<br><i class="fas fa-chart-line"></i> Gráfica de prueba creada exitosamente';
            }
            
            // Crear gráfica de mermas por causa
            const causaCtx = document.getElementById('causaChart');
            if (causaCtx && !charts.causa) {
                charts.causa = new Chart(causaCtx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Caducidad', 'Contaminación', 'Manejo', 'Otros'],
                        datasets: [{
                            data: [45.2, 32.8, 28.5, 19.0],
                            backgroundColor: ['#dc3545', '#ffc107', '#17a2b8', '#6f42c1'],
                            borderWidth: 2,
                            borderColor: '#fff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Distribución por Causa',
                                color: '#495057',
                                font: { size: 16 }
                            },
                            legend: {
                                position: 'bottom'
                            }
                        }
                    }
                });
            }
            
            // Crear gráfica de mermas por galpón
            const galponCtx = document.getElementById('galponChart');
            if (galponCtx && !charts.galpon) {
                charts.galpon = new Chart(galponCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Galpón 1', 'Galpón 2', 'Galpón 3', 'Galpón 4'],
                        datasets: [{
                            label: 'Cantidad (kg)',
                            data: [35.2, 28.8, 42.5, 19.0],
                            backgroundColor: 'rgba(220, 53, 69, 0.8)',
                            borderColor: '#dc3545',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            title: {
                                display: true,
                                text: 'Mermas por Galpón',
                                color: '#495057',
                                font: { size: 16 }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { color: '#495057' }
                            },
                            x: {
                                ticks: { color: '#495057' }
                            }
                        }
                    }
                });
            }
            
        } catch (error) {
            statusDiv.className = 'alert alert-danger';
            statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Error: ' + error.message;
            console.error('Error en testChart:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 DOM cargado, verificando Chart.js...');
        
        // Verificar Chart.js automáticamente
        setTimeout(() => {
            if (typeof Chart !== 'undefined') {
                document.getElementById('chartStatus').className = 'alert alert-success';
                document.getElementById('chartStatus').innerHTML = '<i class="fas fa-check-circle"></i> Chart.js cargado correctamente';
                console.log('✅ Chart.js detectado automáticamente');
            } else {
                document.getElementById('chartStatus').className = 'alert alert-warning';
                document.getElementById('chartStatus').innerHTML = '<i class="fas fa-exclamation-triangle"></i> Chart.js no detectado automáticamente';
                console.log('⚠️ Chart.js no detectado automáticamente');
            }
        }, 1000);
    });
    </script>
</body>
</html>
